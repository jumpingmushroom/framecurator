[project]
name = "framecurator"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = ["httpx", "pyyaml", "fastapi", "uvicorn", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framecurator = ["frame/static/*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
