name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_version.py ${{ github.ref_name }}
      - name: Extract release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "[" v "]") || index($0, " " v " ") || index($0, " " v "$")} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $v" >&2; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jumpingmushroom/framecurator:${{ steps.ver.outputs.version }}
            ghcr.io/jumpingmushroom/framecurator:latest
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
